<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magical DNA Helix</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at center, #10104a 0%, #070720 35%, #02020c 75%, #000 100%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-size: clamp(18px, 3vw, 30px);
      text-shadow:
        0 0 10px #00ffff,
        0 0 25px #8a2be2;
      pointer-events: none;
    }

    .subtitle {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: #a8a8d8;
      font-size: 12px;
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    button {
      border: 1px solid rgba(0, 255, 255, 0.5);
      background: rgba(10, 10, 45, 0.7);
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }

    button:hover {
      background: rgba(0, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
  </style>
</head>

<body>

  <div class="title">Magical DNA</div>
  <div class="subtitle">GEOMETRIC HELIX • DIGITAL EVOLUTION</div>

  <canvas id="dnaCanvas"></canvas>

  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="fasterBtn">Faster</button>
    <button id="slowerBtn">Slower</button>
  </div>

  <script>
    const canvas = document.getElementById("dnaCanvas");
    const ctx = canvas.getContext("2d");

    let width;
    let height;

    let rotation = 0;
    let speed = 0.018;
    let paused = false;

    const POINTS = 32;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();


    // ----------------------------------
    // Draw glowing geometric hexagon
    // ----------------------------------

    function drawHexagon(x, y, size, color, rotation, glow) {

      ctx.save();

      ctx.translate(x, y);
      ctx.rotate(rotation);

      // Glow
      ctx.shadowBlur = glow;
      ctx.shadowColor = color;

      ctx.beginPath();

      for (let i = 0; i < 6; i++) {

        const angle = (Math.PI / 3) * i;

        const px = Math.cos(angle) * size;
        const py = Math.sin(angle) * size;

        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }

      ctx.closePath();

      ctx.fillStyle = color;
      ctx.fill();

      ctx.shadowBlur = 0;

      // Inner shape
      ctx.beginPath();

      for (let i = 0; i < 6; i++) {

        const angle = (Math.PI / 3) * i;

        const px = Math.cos(angle) * size * 0.55;
        const py = Math.sin(angle) * size * 0.55;

        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }

      ctx.closePath();

      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fill();

      ctx.restore();
    }


    // ----------------------------------
    // Draw connection between DNA strands
    // ----------------------------------

    function drawConnection(x1, y1, x2, y2, alpha) {

      const gradient = ctx.createLinearGradient(
        x1,
        y1,
        x2,
        y2
      );

      gradient.addColorStop(0, `rgba(0,255,255,${alpha})`);
      gradient.addColorStop(0.5, `rgba(150,80,255,${alpha})`);
      gradient.addColorStop(1, `rgba(255,0,255,${alpha})`);

      ctx.save();

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#8a2be2";

      ctx.setLineDash([6, 8]);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.restore();
    }


    // ----------------------------------
    // Draw magical particles
    // ----------------------------------

    function drawParticle(x, y, size, alpha) {

      ctx.save();

      ctx.fillStyle = `rgba(255,255,255,${alpha})`;

      ctx.shadowBlur = 12;
      ctx.shadowColor = "#00ffff";

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }


    // ----------------------------------
    // Main DNA
    // ----------------------------------

    function drawDNA() {

      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      const dnaHeight = Math.min(height * 0.75, 650);
      const dnaWidth = Math.min(width * 0.38, 260);

      const startY = centerY - dnaHeight / 2;

      const points = [];

      // Create DNA points
      for (let i = 0; i < POINTS; i++) {

        const progress = i / (POINTS - 1);

        const y = startY + progress * dnaHeight;

        const wave =
          Math.sin(
            progress * Math.PI * 4 + rotation
          );

        const x1 =
          centerX +
          wave * dnaWidth / 2;

        const x2 =
          centerX -
          wave * dnaWidth / 2;

        points.push({
          x1,
          x2,
          y
        });
      }


      // ----------------------------------
      // Connections
      // ----------------------------------

      points.forEach((point, i) => {

        const alpha =
          0.25 +
          Math.sin(
            i * 0.4 + rotation
          ) * 0.1;

        drawConnection(
          point.x1,
          point.y,
          point.x2,
          point.y,
          alpha
        );

      });


      // ----------------------------------
      // DNA geometric shapes
      // ----------------------------------

      points.forEach((point, i) => {

        const leftColor =
          i % 2 === 0
            ? "#00ffff"
            : "#00ff99";

        const rightColor =
          i % 2 === 0
            ? "#ff00ff"
            : "#9b59ff";

        const shapeRotation =
          rotation * 2 + i * 0.3;

        drawHexagon(
          point.x1,
          point.y,
          13,
          leftColor,
          shapeRotation,
          18
        );

        drawHexagon(
          point.x2,
          point.y,
          13,
          rightColor,
          -shapeRotation,
          18
        );


        // Tiny glowing particles
        if (i % 2 === 0) {

          const particleX =
            centerX +
            Math.sin(
              i * 1.7 + rotation * 3
            ) * (dnaWidth * 0.65);

          const particleY =
            point.y;

          drawParticle(
            particleX,
            particleY,
            2,
            0.7
          );
        }

      });


      // ----------------------------------
      // Central glowing line
      // ----------------------------------

      ctx.save();

      const centerGradient =
        ctx.createLinearGradient(
          0,
          startY,
          0,
          startY + dnaHeight
        );

      centerGradient.addColorStop(
        0,
        "rgba(0,255,255,0)"
      );

      centerGradient.addColorStop(
        0.5,
        "rgba(120,80,255,0.3)"
      );

      centerGradient.addColorStop(
        1,
        "rgba(255,0,255,0)"
      );

      ctx.strokeStyle = centerGradient;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 25;
      ctx.shadowColor = "#8a2be2";

      ctx.beginPath();

      ctx.moveTo(
        centerX,
        startY
      );

      ctx.lineTo(
        centerX,
        startY + dnaHeight
      );

      ctx.stroke();

      ctx.restore();
    }


    // ----------------------------------
    // Animation
    // ----------------------------------

    function animate() {

      if (!paused) {
        rotation += speed;
      }

      drawDNA();

      requestAnimationFrame(animate);
    }

    animate();


    // ----------------------------------
    // Controls
    // ----------------------------------

    const pauseBtn =
      document.getElementById("pauseBtn");

    const fasterBtn =
      document.getElementById("fasterBtn");

    const slowerBtn =
      document.getElementById("slowerBtn");


    pauseBtn.addEventListener(
      "click",
      () => {

        paused = !paused;

        pauseBtn.textContent =
          paused ? "Play" : "Pause";

      }
    );


    fasterBtn.addEventListener(
      "click",
      () => {

        speed = Math.min(
          speed + 0.01,
          0.1
        );

      }
    );


    slowerBtn.addEventListener(
      "click",
      () => {

        speed = Math.max(
          speed - 0.01,
          0.002
        );

      }
    );

  </script>

</body>
</html>
